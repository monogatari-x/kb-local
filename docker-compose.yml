services:
  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: kb-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
      - ./config/qdrant.yaml:/qdrant/config/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "perl -e 'use IO::Socket::INET; IO::Socket::INET->new(PeerAddr=>\"localhost\",PeerPort=>6333,Proto=>\"tcp\",Timeout=>2) or exit 1'"]
      interval: 10s
      retries: 5

volumes:
  qdrant_data:
