<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kb-local · 本地知识库</title>
<style>
:root {
  --bg: #0f1115;
  --panel: #161a22;
  --panel-2: #1c2129;
  --border: #2a3140;
  --text: #e6e9ef;
  --text-dim: #8b94a3;
  --accent: #5b9cff;
  --accent-hover: #7fb0ff;
  --code-bg: #0a0c10;
  --score-high: #4ade80;
  --score-mid: #facc15;
  --score-low: #fb923c;
  --error: #f87171;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 24px 20px 60px;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
  flex-wrap: wrap;
  gap: 12px;
}

header h1 {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.3px;
}

header h1 .accent { color: var(--accent); }

.status-bar {
  display: flex;
  gap: 18px;
  font-size: 12px;
  color: var(--text-dim);
}

.status-bar .stat {
  display: flex;
  align-items: baseline;
  gap: 4px;
}

.status-bar .stat .num {
  color: var(--text);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.search-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 20px;
}

.search-row {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
}

.search-row input[type="text"] {
  flex: 1;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 9px 12px;
  font-size: 14px;
  outline: none;
}

.search-row input[type="text"]:focus {
  border-color: var(--accent);
}

.search-row button {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
}

.search-row button:hover:not(:disabled) { background: var(--accent-hover); }
.search-row button:disabled { opacity: 0.6; cursor: not-allowed; }

.filters {
  display: grid;
  grid-template-columns: 1fr 1fr 2fr;
  gap: 12px;
  align-items: center;
}

.filters label {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12px;
  color: var(--text-dim);
}

.filters select,
.filters input[type="number"] {
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 6px 10px;
  font-size: 13px;
  outline: none;
}

.filters select:focus,
.filters input[type="number"]:focus { border-color: var(--accent); }

.filters .threshold label {
  display: flex;
  justify-content: space-between;
}

.filters .threshold input[type="range"] {
  width: 100%;
  margin-top: 4px;
  accent-color: var(--accent);
}

.results-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  color: var(--text-dim);
  font-size: 13px;
}

.result-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 10px;
  transition: border-color 0.15s;
}

.result-card:hover { border-color: #3a4351; }

.result-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  font-size: 12px;
}

.citation {
  color: var(--accent);
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  word-break: break-all;
}

.badges {
  display: flex;
  gap: 6px;
  align-items: center;
}

.badge {
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 500;
  background: var(--panel-2);
  color: var(--text-dim);
  border: 1px solid var(--border);
}

.badge.score-high { color: var(--score-high); border-color: var(--score-high); }
.badge.score-mid  { color: var(--score-mid);  border-color: var(--score-mid); }
.badge.score-low  { color: var(--score-low);  border-color: var(--score-low); }

.result-card pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  margin: 0;
  overflow-x: auto;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--text);
  white-space: pre-wrap;
  word-break: break-word;
}

.message {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-dim);
  font-size: 13px;
}

.message.error { color: var(--error); }

.spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}

@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 640px) {
  .filters { grid-template-columns: 1fr; }
  .status-bar { flex-wrap: wrap; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1><span class="accent">kb-local</span> · 本地知识库</h1>
    <div class="status-bar" id="status-bar">
      <span class="stat">加载中...</span>
    </div>
  </header>

  <div class="search-card">
    <div class="search-row">
      <input id="query" type="text" placeholder="输入查询(1-3 个关键词效果最佳),回车搜索"
             autocomplete="off">
      <button id="search-btn">搜索</button>
    </div>
    <div class="filters">
      <label>
        项目
        <select id="project">
          <option value="">全部</option>
        </select>
      </label>
      <label>
        top_k
        <input id="top-k" type="number" min="1" max="50" value="10">
      </label>
      <label class="threshold">
        <span>阈值 <span id="threshold-val">0.30</span></span>
        <input id="threshold" type="range" min="0" max="1" step="0.05" value="0.3">
      </label>
    </div>
  </div>

  <div class="results-header" id="results-header" style="display:none;">
    <span id="results-count"></span>
    <span id="results-time"></span>
  </div>

  <div id="results"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let inFlight = null;

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    throw new Error(`${r.status} ${r.statusText}`);
  }
  return r.json();
}

async function loadStatus() {
  try {
    const s = await api('/status');
    $('status-bar').innerHTML = `
      <span class="stat"><span class="num">${s.documents}</span> 文档</span>
      <span class="stat"><span class="num">${s.chunks}</span> 切片</span>
      <span class="stat"><span class="num">${s.watch_dirs}</span> 监控目录</span>
      <span class="stat"><span class="num">${s.jobs}</span> 任务</span>
    `;
  } catch (e) {
    $('status-bar').innerHTML = `<span class="stat" style="color:var(--error)">状态获取失败</span>`;
  }
}

async function loadProjects() {
  try {
    const data = await api('/projects');
    const sel = $('project');
    data.projects.forEach((p) => {
      const opt = document.createElement('option');
      opt.value = p;
      opt.textContent = p;
      sel.appendChild(opt);
    });
  } catch (e) {
  }
}

function scoreClass(score) {
  if (score >= 0.7) return 'score-high';
  if (score >= 0.4) return 'score-mid';
  return 'score-low';
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

function renderResults(results, elapsedMs) {
  const header = $('results-header');
  const box = $('results');

  if (results.length === 0) {
    header.style.display = 'none';
    box.innerHTML = `<div class="message">未找到匹配结果<br>尝试降低阈值或更换关键词</div>`;
    return;
  }

  header.style.display = 'flex';
  $('results-count').textContent = `${results.length} 条结果`;
  $('results-time').textContent = `${elapsedMs.toFixed(0)} ms`;

  box.innerHTML = results.map((r) => `
    <div class="result-card">
      <div class="result-meta">
        <span class="citation">${escapeHtml(r.citation)}</span>
        <span class="badges">
          <span class="badge">${escapeHtml(r.chunk_type || '')}</span>
          ${r.project ? `<span class="badge">${escapeHtml(r.project)}</span>` : ''}
          <span class="badge ${scoreClass(r.score)}">score ${r.score.toFixed(3)}</span>
        </span>
      </div>
      <pre>${escapeHtml(r.text)}</pre>
    </div>
  `).join('');
}

function renderError(msg) {
  $('results-header').style.display = 'none';
  $('results').innerHTML = `<div class="message error">${escapeHtml(msg)}</div>`;
}

function renderLoading() {
  $('results-header').style.display = 'none';
  $('results').innerHTML = `<div class="message"><span class="spinner"></span>检索中...</div>`;
}

async function doSearch() {
  const query = $('query').value.trim();
  if (!query) return;

  const myReq = Symbol('req');
  inFlight = myReq;
  $('search-btn').disabled = true;
  renderLoading();

  const t0 = performance.now();
  try {
    const data = await api('/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        query,
        top_k: parseInt($('top-k').value, 10) || 10,
        project: $('project').value || null,
        threshold: parseFloat($('threshold').value),
      }),
    });
    if (inFlight !== myReq) return;
    renderResults(data.results, performance.now() - t0);
  } catch (e) {
    if (inFlight !== myReq) return;
    renderError(`检索失败: ${e.message}`);
  } finally {
    if (inFlight === myReq) $('search-btn').disabled = false;
  }
}

$('search-btn').addEventListener('click', doSearch);
$('query').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doSearch();
});
$('threshold').addEventListener('input', (e) => {
  $('threshold-val').textContent = parseFloat(e.target.value).toFixed(2);
});

loadStatus();
loadProjects();
</script>
</body>
</html>
