[project]
name = "kb-local"
version = "0.1.0"
description = "Local RAG knowledge base"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlmodel>=0.0.18",
    "qdrant-client>=1.10",
    "sentence-transformers>=3.0",
    "FlagEmbedding>=1.2.2",
    "tree-sitter>=0.21,<0.22",
    "tree-sitter-languages>=1.10",
    "markdown-it-py>=3.0",
    "tiktoken>=0.7",
    "typer>=0.12",
    "rich>=13.7",
    "loguru>=0.7",
    "PyYAML>=6.0",
    "aiofiles>=23.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "testcontainers[qdrant]>=4.7",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"kb_core/embeddings/bge_m3.py" = ["N801"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: tests requiring external services (Docker, Qdrant)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kb_core", "kb_cli"]
